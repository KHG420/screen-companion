<!doctype html><meta charset="utf-8"><title>同屏 · 动态媒体性能对照</title>
<h1>动态媒体性能对照（开发环境）</h1><p>合成 1080p / 30 FPS 画面和音频，使用实际 Call 与 WebRTC。统计不是公网延迟或真机性能承诺。</p>
<button id="run">运行编解码对照</button><pre id="result">等待开始</pre><video id="view" autoplay muted playsinline width="640"></video>
<script type="module">
import {Call,qualities} from '../call.js';
const wait=ms=>new Promise(r=>setTimeout(r,ms)); const out=document.querySelector('#result');const view=document.querySelector('#view');let timers=[];let source;
const report=[];let audio;
navigator.mediaDevices.getUserMedia=async()=>{const dest=audio.createMediaStreamDestination();return dest.stream;};
navigator.mediaDevices.getDisplayMedia=async()=>{
 const c=document.createElement('canvas');c.width=1920;c.height=1080;const ctx=c.getContext('2d');let n=0;
 function draw(){const offset=n*7%80;ctx.fillStyle='#182137';ctx.fillRect(0,0,c.width,c.height);ctx.font='28px sans-serif';
 for(let y=-80;y<1080;y+=80){ctx.fillStyle=y%160?'#23435b':'#426879';ctx.fillRect(0,y+offset,1920,40);ctx.fillStyle='#f2d28d';ctx.fillText('Screen Companion 0123456789 • moving text '.repeat(3),20,y+offset+30);}
 ctx.fillStyle='#ff705e';ctx.fillRect(n*13%1700,450,200,200);ctx.fillStyle='white';ctx.fillText(String(n++),20,100);}
 draw();timers.push(setInterval(draw,1000/30));source=c.captureStream(30);return source;
};
function row(r,type){return [...r.values()].find(s=>s.type===type&&s.kind==='video'&&s.mid==='1');}
function metrics(a,b,report){const elapsed=(b.timestamp-a.timestamp)/1000;const frames=b.framesEncoded-a.framesEncoded;const codec=report.get(b.codecId);return {codec:codec?.mimeType,encoder:b.encoderImplementation,powerEfficient:b.powerEfficientEncoder,width:b.frameWidth,height:b.frameHeight,fps:frames/elapsed,encodeMs:frames?1000*(b.totalEncodeTime-a.totalEncodeTime)/frames:null,sendQueueMs:1000*(b.totalPacketSendDelay-a.totalPacketSendDelay)/(b.packetsSent-a.packetsSent),limitation:b.qualityLimitationReason};}
async function run(codec){let h,g;
 try {h=new Call('/api');await h.start();if(codec){const codecs=RTCRtpSender.getCapabilities('video').codecs;h.video.setCodecPreferences([...codecs.filter(c=>c.mimeType===codec),...codecs.filter(c=>c.mimeType!==codec)]);}
 g=new Call('/api',s=>{if(s.remoteVideo&&view.srcObject?.getVideoTracks()[0]!==s.remoteVideo)view.srcObject=new MediaStream([s.remoteVideo]);});await g.start(h.state.roomId);
 for(let i=0;i<100&&!h.state.connected;i++)await wait(100);if(!h.state.connected)throw Error('Connection timeout');
 await h.share();await wait(5000);const a=await h.pc.getStats();await wait(15000);const b=await h.pc.getStats();const recv=await g.pc.getStats();const result=metrics(row(a,'outbound-rtp'),row(b,'outbound-rtp'),b);result.requested=codec||'default';result.receiver=row(recv,'inbound-rtp');report.push(result);out.textContent=JSON.stringify(report,null,2);
 }finally{h?.end();g?.end();timers.forEach(clearInterval);timers=[];source?.getTracks().forEach(t=>t.stop());view.srcObject=null;}}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;audio=new AudioContext();await audio.resume();try{await run(null);if(RTCRtpSender.getCapabilities('video').codecs.some(c=>c.mimeType==='video/H264'))await run('video/H264');document.body.dataset.done='true';}catch(e){out.textContent+='\nERROR '+e.stack;document.body.dataset.done='error';}finally{await audio.close();document.querySelector('#run').disabled=false;}};
</script>
