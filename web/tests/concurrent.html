<!doctype html><meta charset="utf-8"><title>同屏 · 并发媒体性能验证</title>
<h1>摄像头与屏幕并发验证</h1>
<p>合成动态画面，无需打开真实摄像头或录屏。双向 720p30 摄像头和单向 1440p30 屏幕，经实际 Call 和本地信令传输。</p>
<button id="run">运行测试</button><pre id="result">等待开始</pre>
<video id="screen" autoplay muted playsinline width="640"></video>
<video id="camera" autoplay muted playsinline width="320"></video>
<script type="module">
import {Call} from '../call.js';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const out=document.querySelector('#result'),button=document.querySelector('#run');
const screen=document.querySelector('#screen'),camera=document.querySelector('#camera');
const originalCamera=navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
const originalDisplay=navigator.mediaDevices.getDisplayMedia.bind(navigator.mediaDevices);
let timers=[],streams=[],audio;
function source(w,h){
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
 const ctx=canvas.getContext('2d',{alpha:false});let n=0;
 const stream=canvas.captureStream(0),track=stream.getVideoTracks()[0];streams.push(stream);
 const draw=()=>{ctx.fillStyle='#293345';ctx.fillRect(0,0,w,h);ctx.fillStyle='#f2d28d';ctx.font='28px monospace';
 for(let y=40;y<(w===1280?100:h);y+=60)ctx.fillText(`清晰文字 Screen Companion 0123456789 ${n} `.repeat(5),10,y);
 ctx.fillStyle='#e98560';ctx.fillRect(n*15%(w-160),h/2,160,160);n++;track.requestFrame();};
 draw();timers.push(setInterval(draw,1000/30));return stream;
}
function rows(report){return [...report.values()].filter(r=>['outbound-rtp','inbound-rtp'].includes(r.type)&&r.kind==='video');}
function metrics(before,report){return rows(report).map(r=>{
 const a=before.get(r.id)||{},dt=(r.timestamp-a.timestamp)/1000,sending=r.type==='outbound-rtp';
 const frames=sending?'framesEncoded':'framesDecoded',bytes=sending?'bytesSent':'bytesReceived';
 const avg=(total,count)=>r[count]>a[count]?(r[total]-a[total])*1000/(r[count]-a[count]):null;
 return {direction:r.type,mid:r.mid,width:r.frameWidth,height:r.frameHeight,fps:(r[frames]-a[frames])/dt,mbps:8*(r[bytes]-a[bytes])/dt/1e6,
 codec:report.get(r.codecId)?.mimeType,implementation:r.encoderImplementation||r.decoderImplementation,powerEfficient:r.powerEfficientEncoder??r.powerEfficientDecoder,
 encodeMs:avg('totalEncodeTime','framesEncoded'),decodeMs:avg('totalDecodeTime','framesDecoded'),queueMs:avg('totalPacketSendDelay','packetsSent'),bufferMs:avg('jitterBufferDelay','jitterBufferEmittedCount'),freezes:r.freezeCount-a.freezeCount,limitation:r.qualityLimitationReason};});}
button.onclick=async()=>{
 button.disabled=true;document.body.dataset.done='running';let host,guest;const results={samples:[]};
 try{
 audio=new AudioContext();audio.resume().catch(()=>{});
 navigator.mediaDevices.getUserMedia=async q=>q.video?source(1280,720):audio.createMediaStreamDestination().stream;
 navigator.mediaDevices.getDisplayMedia=async()=>source(2560,1440);
 host=new Call('/api');guest=new Call('/api',s=>{
 for(const [el,track] of [[screen,s.remoteVideo],[camera,s.remoteCamera]])if(track&&el.srcObject?.getVideoTracks()[0]!==track){el.srcObject=new MediaStream([track]);el.play().catch(()=>{});}
 });
 await host.start();await guest.start(host.state.roomId);
 for(let i=0;i<200&&!(host.state.connected&&guest.state.connected&&host.state.chatReady&&guest.state.chatReady);i++)await wait(100);
 if(!host.state.chatReady||!guest.state.chatReady)throw Error('Connection timeout');
 await host.toggleCamera();await guest.toggleCamera();await host.share();
 if(!host.state.cameraOn||!guest.state.cameraOn||!host.state.sharing)throw Error(JSON.stringify([host.state.error,guest.state.error]));
 await wait(15000);let a=await host.pc.getStats(),b=await guest.pc.getStats();
 for(let i=0;i<5;i++){await wait(3000);const next=await host.pc.getStats(),other=await guest.pc.getStats();results.samples.push({host:metrics(a,next),guest:metrics(b,other)});a=next;b=other;out.textContent=JSON.stringify(results,null,2);}
 results.cameraParameters=host.cameraVideo.sender.getParameters();results.screenParameters=host.video.sender.getParameters();
 results.connected=host.state.connected&&guest.state.connected;results.network=host.state.network;
 results.nearTarget=results.samples.every(sample=>['host','guest'].every(side=>{
  const rows=sample[side].filter(r=>r.width);return rows.length===3&&rows.every(r=>r.width===(r.mid==='1'?2560:1280)&&r.height===(r.mid==='1'?1440:720)&&r.fps>=28.5&&!(r.freezes>0));
 }));document.body.dataset.done='true';
 }catch(e){results.error=e.stack;document.body.dataset.done='error';}
 finally{
 host?.end();guest?.end();timers.forEach(clearInterval);timers=[];streams.forEach(s=>s.getTracks().forEach(t=>t.stop()));streams=[];
 screen.srcObject=camera.srcObject=null;await audio?.close();
 navigator.mediaDevices.getUserMedia=originalCamera;navigator.mediaDevices.getDisplayMedia=originalDisplay;
 out.textContent=JSON.stringify(results,null,2);button.disabled=false;
 }
};
</script>
