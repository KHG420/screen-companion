<!doctype html><meta charset="utf-8"><title>预览播放性能验证</title>
<button id="run" disabled>运行预览验证</button><pre id="result"></pre><iframe id="app" style="width:1100px;height:760px"></iframe>
<script type="module">
const frame=document.querySelector('#app');
const source=await (await fetch('../app.js',{cache:'no-store'})).text();
const html=await (await fetch('../index.html',{cache:'no-store'})).text();
const harness=`
window.previewRun=async()=>{
 const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;const ctx=canvas.getContext('2d');let n=0;
 const paint=setInterval(()=>{ctx.fillStyle=n++%2?'#125':'#456';ctx.fillRect(0,0,1280,720);ctx.fillStyle='white';ctx.font='48px sans-serif';ctx.fillText(String(n),50,100);},33);
 const stream=canvas.captureStream(30),track=stream.getVideoTracks()[0];
 const session=new Call('/api',render);call=session;
 Object.assign(session.state,{connected:true,chatReady:true,cameraOn:true,remoteCameraOn:true,localCamera:track,remoteCamera:track,sharing:true,localVideo:track,roomId:'12345678',messages:[]});
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const sample=async()=>{const el=$('local-camera'),before=el.getVideoPlaybackQuality().totalVideoFrames;await wait(2000);return {paused:el.paused,frames:el.getVideoPlaybackQuality().totalVideoFrames-before,trackLive:track.readyState,trackEnabled:track.enabled,screenPaused:$('screen').paused};};
 try{render(session.state);await wait(1000);const visible=await sample();$('camera-preview').click();await wait(500);const hidden=await sample();$('camera-preview').click();await wait(500);const restored=await sample();return {visible,hidden,restored};}
 finally{clearInterval(paint);stream.getTracks().forEach(t=>t.stop());session.end('',false);}
};
parent.document.querySelector('#run').disabled=false;
`;
frame.srcdoc=html.replace('<head>','<head><base href="/">').replace(/<script type="module" src="app.js"><\/script>/,`<script type="module">${source.replace("'./call.js'","'/call.js'")}\n${harness}<\/script>`);
document.querySelector('#run').onclick=async()=>{document.body.dataset.done='running';try{document.querySelector('#result').textContent=JSON.stringify(await frame.contentWindow.previewRun());document.body.dataset.done='yes';}catch(e){document.querySelector('#result').textContent=e.stack;document.body.dataset.done='error';}};
</script>
