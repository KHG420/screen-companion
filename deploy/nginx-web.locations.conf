# Include inside your own HTTPS server block.
location = /screenshare { return 301 /screenshare/; }
location /screenshare/api/ {
    proxy_pass http://127.0.0.1:18600/;
    proxy_http_version 1.1;
    proxy_read_timeout 35s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
# Android uses the origin's existing /v1/rooms API, including invitation links.
location ~ ^/v1/rooms(?:/|$) {
    proxy_pass http://127.0.0.1:18600;
    proxy_http_version 1.1;
    proxy_read_timeout 35s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
location /screenshare/ {
    alias /opt/screenshare/web/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
